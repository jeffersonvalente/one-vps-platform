# SOPS + age
# Generate the key: age-keygen -o ~/.config/sops/age/keys.txt
# Paste the "public key: age1..." part below. The private key NEVER goes into the repo.
#
# Usage:
#   sops ansible/inventory/group_vars/all/vault.sops.yml          # edit encrypted
#   sops -d ansible/inventory/group_vars/all/vault.sops.yml       # decrypt to stdout
creation_rules:
  - path_regex: \.sops\.ya?ml$
    age: "age1REPLACE_WITH_YOUR_PUBLIC_KEY"
  - path_regex: terraform/.*\.tfvars\.sops$
    age: "age1REPLACE_WITH_YOUR_PUBLIC_KEY"
