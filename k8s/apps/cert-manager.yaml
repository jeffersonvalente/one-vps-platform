---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.17.1
      helm:
        valuesObject:
          crds: { enabled: true }
          resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 192Mi } }
          webhook: { resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 96Mi } } }
          cainjector: { resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 192Mi } } }
    # ClusterIssuer (DNS-01 Cloudflare) lives in this repo
    - repoURL: https://github.com/YOUR_GITHUB_USER/one-vps-platform.git
      targetRevision: main
      path: k8s/apps/cert-manager
  destination: { server: https://kubernetes.default.svc, namespace: cert-manager }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
