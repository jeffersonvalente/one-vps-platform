---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.12.0
    helm:
      valuesObject:
        controller:
          # One node, no LoadBalancer: hostNetwork + DaemonSet, listens on 80/443 (tailnet only).
          kind: DaemonSet
          hostNetwork: true
          hostPort: { enabled: true }
          dnsPolicy: ClusterFirstWithHostNet
          service: { type: ClusterIP }
          ingressClassResource: { default: true }
          # 80/443 sit on hostNetwork, but ufw only accepts via tailscale0.
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          admissionWebhooks: { enabled: false } # saves one pod on a single node
  destination: { server: https://kubernetes.default.svc, namespace: ingress-nginx }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
