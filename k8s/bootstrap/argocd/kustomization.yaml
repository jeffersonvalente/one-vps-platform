---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# ArgoCD "core": no UI, Dex, notifications. ~300 MB.
# UI on demand: `argocd admin dashboard -n argocd` (opens on localhost via port-forward)
# root-app.yaml is applied separately by scripts/bootstrap-argocd.sh (needs the CRDs first)
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.6/manifests/core-install.yaml

patches:
  - target: { kind: Deployment, name: argocd-repo-server }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
  - target: { kind: StatefulSet, name: argocd-application-controller }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
